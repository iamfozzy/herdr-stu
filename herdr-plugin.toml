id = "stu"
name = "Stu"
version = "0.8.0"
min_herdr_version = "0.8.2"
description = "Worktree tooling: per-project bootstrap of new worktrees in a visible pane with sidebar status; report per-workspace $run (running app) and $git_dirty / $git_conflict (working-tree state) and $pr_pass / $pr_fail / $pr_pending (open GitHub PR + CI) Space tokens; popups to open a PR or any remote branch as a worktree, and to remove a worktree even when it has submodules"
platforms = ["macos", "linux"]

[[startup]]
command = ["bash", "on-pane-changed.sh"]

[[events]]
on = "worktree.created"
command = ["bash", "on-worktree.sh"]

[[events]]
on = "worktree.opened"
command = ["bash", "on-worktree.sh"]

[[events]]
on = "workspace.closed"
command = ["bash", "on-workspace-closed.sh"]

[[events]]
on = "pane.created"
command = ["bash", "on-pane-changed.sh"]

[[events]]
on = "pane.focused"
command = ["bash", "on-pane-changed.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "on-pane-changed.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "on-pane-changed.sh"]

[[panes]]
id = "pick-pr"
title = "Open PR as worktree"
placement = "popup"
width = "85%"
height = "70%"
command = ["bash", "open-remote.sh", "pick-pr"]

[[panes]]
id = "pick-branch"
title = "Open remote branch as worktree"
placement = "popup"
width = "85%"
height = "70%"
command = ["bash", "open-remote.sh", "pick-branch"]

[[panes]]
id = "confirm-remove"
title = "Remove worktree"
placement = "popup"
width = "70%"
height = "40%"
command = ["bash", "remove-worktree.sh"]

[[actions]]
id = "remove-worktree"
title = "Remove worktree (works with submodules)"
contexts = ["workspace"]
command = ["bash", "open-remote.sh", "launch", "confirm-remove"]

[[actions]]
id = "open-pr"
title = "Open PR as worktree"
contexts = ["workspace"]
command = ["bash", "open-remote.sh", "launch", "pick-pr"]

[[actions]]
id = "open-branch"
title = "Open remote branch as worktree"
contexts = ["workspace"]
command = ["bash", "open-remote.sh", "launch", "pick-branch"]

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "stu.open-pr"
description = "open a GitHub PR's branch as a worktree"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "stu.open-branch"
description = "open a remote branch as a worktree"
